# contracts/deploy.md §6. v1 기본 server 블록과 겹치는지는 서버에서 nginx -t로 본다(tasks D1 단계 1).
# default_server: CloudFront가 보내는 Host가 무엇이든 이 블록이 받는다(10/28 사용자 — D6 화면이 nginx 기본 페이지를 대신함).
# v1 nginx.conf에도 default_server가 있으면 nginx -t가 실패해 setup-host.sh가 멈춘다(크게 실패).
server {
    listen 80 default_server;
    server_name _;

    root /opt/how-much/app/current;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_intercept_errors off;
        proxy_read_timeout 25s;
        client_max_body_size 3m;
        access_log off;

        # nginx가 직접 내는 오류만 바꾼다(서버가 낸 응답은 그대로 간다)
        error_page 413 @api_invalid_input;
        error_page 500 502 503 504 @api_unavailable;
    }

    location @api_invalid_input {
        access_log off;
        default_type "application/json; charset=utf-8";
        add_header Cache-Control no-store always;
        return 400 '{"code":"invalid_input"}';
    }

    location @api_unavailable {
        access_log off;
        default_type "application/json; charset=utf-8";
        add_header Cache-Control no-store always;
        return 503 '{"code":"unavailable"}';
    }
}
